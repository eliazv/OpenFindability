# Copy into .github/workflows/release-ios.yml in the PRIVATE runner repository.
name: iOS central release
run-name: "ios:${{ inputs.slug }}:${{ inputs.correlation_id }}:${{ inputs.mode }}:${{ inputs.build_name }}+${{ inputs.build_number }}"
on:
  workflow_dispatch:
    inputs:
      slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string
      mode:
        required: true
        type: choice
        options: [unsigned, build, testflight]
      correlation_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ios-${{ inputs.slug }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 75
    environment: ios-release
    env:
      SLUG: ${{ inputs.slug }}
      SHA: ${{ inputs.sha }}
      MODE: ${{ inputs.mode }}
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      CORRELATION_ID: ${{ inputs.correlation_id }}
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - name: Require private runner and default branch
        env:
          PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$PRIVATE" = "true"
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate trusted allowlist
        id: app
        run: python3 validate.py
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: source-token
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ steps.app.outputs.owner }}
          repositories: ${{ steps.app.outputs.repo }}
          permission-contents: read
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.app.outputs.owner }}/${{ steps.app.outputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: source
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ steps.app.outputs.xcode }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.app.outputs.flutter }}
          channel: stable
          cache: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Compile unsigned (no Apple or Match secrets)
        if: inputs.mode == 'unsigned'
        run: bundle exec fastlane ios unsigned
      - name: Sign and optionally upload TestFlight
        if: inputs.mode != 'unsigned'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios release
      - name: Store only validated IPA or unsigned app + release receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-${{ inputs.slug }}-${{ inputs.correlation_id }}
          path: output/
          if-no-files-found: error
          retention-days: 3
      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "ios-release-${GITHUB_RUN_ID}" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          rm -rf "$HOME/.appstoreconnect/private_keys"
