# Central iOS runner. Workflows are API-only: no triggering section and no webhook.
# App identities are NOT in this public repo: the release CLI sends them, and the SHA it
# approves, as RUNNER_APPS_B64 with each build.
# ios-setup --apply fills both groups through the Codemagic API:
# ios_source: SOURCE_KEY_<SLUG>, a read-only GitHub deploy key per app.
# ios_signing: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT, CERTIFICATE_PRIVATE_KEY.
definitions:
  common_environment: &common_environment
    xcode: latest
    flutter: stable
    node: lts
    cocoapods: default
  checkout_unsigned: &checkout_unsigned
    name: Validate approval and checkout source (unsigned)
    script: |
      cd integrations/ios-release-runner
      python3 codemagic_runner.py policy
      python3 codemagic_runner.py checkout --scope unsigned
  checkout_signed: &checkout_signed
    name: Validate approval and checkout source (signed)
    script: |
      cd integrations/ios-release-runner
      python3 codemagic_runner.py policy
      python3 codemagic_runner.py checkout --scope signed
  toolchain: &toolchain
    name: Verify per-app toolchain and install pinned Fastlane gems
    script: |
      cd integrations/ios-release-runner
      python3 codemagic_runner.py toolchain
      bundle config set --local deployment true
      bundle install
  build_unsigned: &build_unsigned
    name: Compile without Apple signing
    script: |
      cd integrations/ios-release-runner
      bundle exec fastlane ios unsigned
  build_signed: &build_signed
    name: Sign IPA and optionally upload to TestFlight
    script: |
      cd integrations/ios-release-runner
      bundle exec fastlane ios release

workflows:
  ios-central-unsigned:
    name: Central iOS compile without signing
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      <<: *common_environment
      groups:
        - ios_source
    scripts:
      - *checkout_unsigned
      - *toolchain
      - *build_unsigned
    artifacts:
      - integrations/ios-release-runner/output/unsigned-app.zip
      - integrations/ios-release-runner/output/release.json
      - integrations/ios-release-runner/output/Podfile.lock

  ios-central-signed:
    name: Central iOS signed build or TestFlight upload
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      <<: *common_environment
      groups:
        - ios_source
        - ios_signing
    scripts:
      - *checkout_signed
      - *toolchain
      - *build_signed
    artifacts:
      - integrations/ios-release-runner/output/release.ipa
      - integrations/ios-release-runner/output/release.json
      - integrations/ios-release-runner/output/Podfile.lock
